<!DOCTYPE html>
<html lang="en" >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Storage </title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <style type="text/tailwindcss">
        @import 'tailwindcss';

        @custom-variant dark (&:where(.dark,.dark *));

     </style>
</head>
<body class="p-10 bg-blue-200 dark:bg-blue-900">

        <button type="button" class="px-3 py-2 bg-yellow-500 dark:text-black font-semibold float-right rounded text-sm " onclick="toggle()">Toggle </button>


    <div class=" bg-blue-100 dark:bg-blue-700 p-10 rounded">
        <h1 class="font-bold text-xl mb-3 dark:text-white"> Browsing Storage API </h1>
        <p class="dark:text-white">We are learning storage in javascript !! </p>
    </div>
    
    <script src="main1.js"></script> 

    <script>
         const html =   document.documentElement
        
        if(localStorage.getItem('theme')==='dark'){
            html.classList.add('dark')
        }
        else{
            html.classList.remove('dark')
        }
        function toggle(){
          const html =   document.documentElement

          if(html.classList.contains('dark')){
            html.classList.remove('dark')
            localStorage.setItem('theme','light')
          }else{
             html.classList.add('dark')
               localStorage.setItem('theme','dark')
          }
        }
    </script>
</body>
</html>
